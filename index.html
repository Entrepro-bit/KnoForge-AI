<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnoForge AI – Whitelabel KI-Plattform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid font-bold">K</i>
                </div>
                <span class="text-xl font-bold tracking-wide">KnoForge AI</span>
            </div>
            <div class="space-x-4">
                <button class="text-slate-300 hover:text-white text-sm font-medium transition">Anmelden</button>
                <button class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-md shadow-blue-500/20 transition">Kostenlos starten</button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
        
        <!-- Linke Spalte: Bot Konfiguration -->
        <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
            <h2 class="text-lg font-semibold flex items-center gap-2 mb-6 text-slate-200">
                <i class="fa-solid fa-gear text-blue-400"></i> Bot Konfiguration
            </h2>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Bot Name</label>
                    <input type="text" id="botName" value="KnoForge Bot" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">System Prompt / Anweisung</label>
                    <textarea id="systemPrompt" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 transition">Du bist ein hilfreicher Kundenservice-Assistent.</textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Firmenwissen / Kontext</label>
                    <textarea id="companyContext" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 transition">Unsere Öffnungszeiten sind Mo-Fr von 9 bis 18 Uhr. Support erfolgt via support@knoforge.ai.</textarea>
                </div>

                <button onclick="generateSnippet()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg text-sm shadow-lg shadow-blue-600/30 transition">
                    Code-Schnipsel generieren
                </button>
            </div>
        </section>

        <!-- Rechte Spalte: Live Preview Chat -->
        <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-sm flex flex-col h-[520px]">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700/50">
                <h2 class="text-sm font-semibold flex items-center gap-2 text-slate-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="chatTitle">KnoForge Bot</span> (Vorschau)
                </h2>
                <span class="text-xs text-slate-500">Live Testumgebung</span>
            </div>

            <!-- Messages Area -->
            <div id="chatMessages" class="flex-1 overflow-y-auto space-y-3 pr-2 mb-4 text-sm scrollbar-thin">
                <div class="flex items-start gap-2">
                    <span class="bg-blue-600 text-xs px-2 py-1 rounded font-bold">AI</span>
                    <div class="bg-slate-700/60 p-3 rounded-lg text-slate-200 max-w-[80%]">
                        Hallo! Wie kann ich dir heute weiterhelfen?
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <form id="chatForm" class="flex gap-2">
                <input type="text" id="userInput" placeholder="Frage stellen..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500 transition">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm transition flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        &copy; 2026 KnoForge AI. Alle Rechte vorbehalten.
    </footer>

    <!-- Chat Logic JavaScript -->
    <script>
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatMessages = document.getElementById('chatMessages');
        const botNameInput = document.getElementById('botName');
        const chatTitle = document.getElementById('chatTitle');

        // Dynamischer Bot-Name in der Vorschau
        botNameInput.addEventListener('input', (e) => {
            chatTitle.textContent = e.target.value || 'KnoForge Bot';
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // User-Nachricht anzeigen
            appendMessage('Du', message, 'user');
            userInput.value = '';

            const systemPrompt = document.getElementById('systemPrompt').value;
            const companyContext = document.getElementById('companyContext').value;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        systemPrompt: systemPrompt,
                        context: companyContext
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    appendMessage('AI', data.reply, 'ai');
                } else {
                    appendMessage('Fehler', data.error || 'Antwort konnte nicht geladen werden.', 'error');
                }
            } catch (err) {
                appendMessage('Fehler', 'Verbindung zur API fehlgeschlagen.', 'error');
            }
        });

        function appendMessage(sender, text, type) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-2 ${type === 'user' ? 'justify-end' : ''}`;

            if (type === 'user') {
                wrapper.innerHTML = `<div class="bg-blue-600 p-3 rounded-lg text-white max-w-[80%]">${escapeHtml(text)}</div>`;
            } else if (type === 'error') {
                wrapper.innerHTML = `<span class="bg-red-600 text-xs px-2 py-1 rounded font-bold">!</span><div class="bg-red-900/40 border border-red-700 p-3 rounded-lg text-red-200 max-w-[80%]">${escapeHtml(text)}</div>`;
            } else {
                wrapper.innerHTML = `<span class="bg-blue-600 text-xs px-2 py-1 rounded font-bold">AI</span><div class="bg-slate-700/60 p-3 rounded-lg text-slate-200 max-w-[80%]">${escapeHtml(text)}</div>`;
            }

            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function generateSnippet() {
            alert("Code-Schnipsel für KnoForge AI generiert!");
        }
    </script>
</body>
</html>
